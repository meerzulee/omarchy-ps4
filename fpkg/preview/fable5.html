<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Omarchy Kernel Manager — Fable 5 Prototype</title>
  <style>
    @font-face {
      font-family: "Omarchy Mark";
      src: url("../../cache/omarchy-quattro/default/fonts/omarchy/omarchy.ttf") format("truetype");
      font-display: block;
      unicode-range: U+E900;
    }

    :root {
      --background: #1a1b26;
      --dark: #13141c;
      --darker: #0e0e14;
      --panel: #24283b;
      --selection: #292e42;
      --foreground: #a9b1d6;
      --bright: #c0caf5;
      --blue: #7aa2f7;
      --green: #9ece6a;
      --warning: #e0af68;
      --error: #f7768e;
      --wallpaper: url("../../cache/omarchy-quattro/themes/tokyo-night/backgrounds/0-winding-road.jpg");
      --overlay-strong: rgba(14,14,20,.90);
      --overlay-mid: rgba(14,14,20,.78);
      --overlay-soft: rgba(14,14,20,.46);
      --overlay-top: rgba(14,14,20,.16);
      --overlay-bottom: rgba(14,14,20,.42);
      --safe-x: clamp(32px, 5.2vw, 100px);
      --safe-y: clamp(28px, 4.8vh, 52px);
      --radius: 14px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--darker);
      color: var(--bright);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.45;
    }

    button,
    input,
    select { font: inherit; }

    button { color: inherit; }

    .shell {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100%;
      background:
        linear-gradient(90deg, var(--overlay-strong) 0%, var(--overlay-mid) 46%, var(--overlay-soft) 100%),
        var(--wallpaper) center / cover no-repeat;
    }

    .shell::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, var(--overlay-top), var(--overlay-bottom));
      pointer-events: none;
    }

    .chrome {
      position: absolute;
      inset: var(--safe-y) var(--safe-x) auto;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 20px;
      min-width: 0;
    }

    .omarchy-wordmark {
      display: block;
      width: clamp(180px, 15vw, 268px);
      aspect-ratio: 800 / 188;
      background: var(--green);
      -webkit-mask: url("../../cache/omarchy-quattro/default/plymouth/logo.png") center / contain no-repeat;
      mask: url("../../cache/omarchy-quattro/default/plymouth/logo.png") center / contain no-repeat;
    }

    .prototype-tag {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(192,202,245,.18);
      border-radius: 999px;
      background: var(--dark);
      color: var(--foreground);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .04em;
    }

    #app {
      position: absolute;
      inset: calc(var(--safe-y) + 82px) var(--safe-x) var(--safe-y);
      display: flex;
      align-items: center;
    }

    .view {
      width: 100%;
      max-height: 100%;
      animation: enter .28s var(--ease) both;
    }

    .home-layout {
      display: grid;
      grid-template-columns: minmax(500px, .78fr) minmax(460px, .8fr);
      align-items: center;
      gap: clamp(55px, 7vw, 140px);
      width: 100%;
    }

    .flow-actions {
      display: grid;
      gap: 9px;
      width: min(500px, 100%);
      margin-top: 22px;
    }

    .flow-actions .button {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 15px;
      align-items: center;
      column-gap: 13px;
      width: 100%;
      min-height: 58px;
      padding: 0 16px 0 14px;
      border-left: 3px solid var(--blue);
      border-radius: 0 4px 4px 0;
      background: rgba(19,20,28,.94);
      font-size: 14px;
    }

    .flow-actions .button:hover:not([disabled]) { background: var(--selection); }

    .flow-label { min-width: 0; }

    .flow-detail {
      color: var(--foreground);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .flow-arrow {
      color: var(--blue);
      font-size: 20px;
      font-weight: 500;
      text-align: right;
    }

    .flow-actions .button.primary .flow-arrow,
    .flow-actions .button.primary .flow-detail { color: var(--darker); }

    .system-check {
      display: grid;
      align-self: center;
      justify-self: end;
      gap: 7px;
      width: min(460px, 100%);
    }

    .system-check-title {
      margin: 0 0 3px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .check-card {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      align-items: center;
      min-height: 52px;
      padding: 0 15px;
      border: 1px solid rgba(192,202,245,.12);
      border-radius: 3px;
      background: rgba(19,20,28,.92);
    }

    .check-card small {
      margin: 0;
      color: var(--foreground);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .check-card strong {
      color: var(--bright);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.25;
      text-align: right;
    }

    .check-card strong.good { color: var(--green); }
    .check-card strong.warn { color: var(--warning); }
    .check-card strong.error { color: var(--error); }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p { margin-top: 0; }

    h1 {
      max-width: 720px;
      margin-bottom: 16px;
      color: var(--bright);
      font-size: clamp(38px, 3.2vw, 59px);
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1.04;
    }

    h2 {
      margin-bottom: 10px;
      color: var(--bright);
      font-size: clamp(29px, 2.25vw, 42px);
      font-weight: 650;
      letter-spacing: -.035em;
      line-height: 1.1;
    }

    h3 {
      margin-bottom: 6px;
      color: var(--bright);
      font-size: 18px;
      font-weight: 650;
    }

    .lede {
      max-width: 640px;
      margin-bottom: 29px;
      color: var(--foreground);
      font-size: clamp(18px, 1.25vw, 22px);
      line-height: 1.5;
    }

    .lede.compact {
      margin-bottom: 22px;
      font-size: 18px;
    }

    .card {
      border: 0;
      border-left: 3px solid rgba(122,162,247,.58);
      border-radius: 0 10px 10px 0;
      background: rgba(19,20,28,.94);
    }

    .card-pad { padding: clamp(24px, 2.15vw, 38px); }

    .actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 27px;
    }

    .button,
    .link-button,
    .option,
    .state-chip {
      appearance: none;
      border: 0;
      cursor: pointer;
      transition: color .16s ease, background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .button {
      min-height: 58px;
      padding: 0 26px;
      border: 1px solid rgba(192,202,245,.16);
      border-radius: 5px;
      background: var(--selection);
      color: var(--bright);
      font-size: 17px;
      font-weight: 700;
      text-align: left;
    }

    .button.primary {
      background: var(--blue);
      color: var(--darker);
    }

    .button.danger {
      border-color: rgba(247,118,142,.4);
      color: var(--error);
    }

    .button[disabled] {
      cursor: not-allowed;
      opacity: .42;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px 23px;
      margin-top: 22px;
    }

    .link-button {
      min-height: 42px;
      padding: 0;
      background: transparent;
      color: var(--foreground);
      font-size: 15px;
      font-weight: 650;
      text-align: left;
    }

    .link-button::after {
      content: "  ›";
      color: var(--blue);
    }

    :focus { outline: none; }

    [data-focus]:focus-visible,
    [data-focus].controller-focus {
      outline: 2px solid var(--blue);
      outline-offset: 5px;
      box-shadow: 0 0 0 4px rgba(122,162,247,.12);
    }

    .button.primary:focus-visible,
    .button.primary.controller-focus {
      outline-color: var(--bright);
    }

    [data-focus]:active { transform: translateY(1px); }

    [data-focus].pressed {
      transform: scale(.985);
      filter: brightness(.88);
    }

    .status-line {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--foreground);
      font-size: 14px;
      font-weight: 650;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
    }

    .status-dot.warning { background: var(--warning); }
    .status-dot.error { background: var(--error); }
    .status-dot.blue { background: var(--blue); }

    .review-list {
      margin: 0;
      border-top: 1px solid rgba(192,202,245,.11);
    }

    .review-row {
      display: grid;
      grid-template-columns: minmax(165px, .75fr) minmax(260px, 1.25fr);
      gap: 28px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(192,202,245,.11);
    }

    .review-row dt {
      color: var(--foreground);
      font-size: 15px;
    }

    .review-row dd {
      margin: 0;
      color: var(--bright);
      font-size: 15px;
      font-weight: 650;
    }

    .review-row dd.good { color: var(--green); }
    .review-row dd.warn { color: var(--warning); }

    .phase-number {
      color: var(--foreground);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      position: relative;
      height: 6px;
      margin: 25px 0 20px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--selection);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
      transition: width .7s var(--ease);
    }

    .phase-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: var(--foreground);
      font-size: 14px;
    }

    .cancel-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .cancel-state::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .cancel-state.unsafe::before { background: var(--warning); }

    .option-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 23px;
    }

    .option {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      align-content: start;
      gap: 18px;
      width: 100%;
      min-height: 162px;
      padding: 20px;
      border: 1px solid rgba(192,202,245,.11);
      border-radius: 7px;
      background: rgba(36,40,59,.94);
      color: var(--bright);
      text-align: left;
    }

    .option:focus-visible,
    .option.controller-focus {
      border-color: var(--blue);
      background: var(--selection);
      transform: translateY(-3px);
    }

    .option-icon {
      display: block;
      width: auto;
      height: auto;
      padding-left: 9px;
      border-left: 3px solid var(--blue);
      border-radius: 0;
      background: transparent;
      color: var(--blue);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .option-copy strong,
    .option-copy small { display: block; }

    .option-copy strong {
      font-size: 16px;
      font-weight: 700;
    }

    .option-copy small {
      margin-top: 2px;
      color: var(--foreground);
      font-size: 13px;
    }

    .option-chevron { color: var(--blue); }

    .option-chevron {
      position: absolute;
      right: 18px;
      bottom: 15px;
    }

    .theme-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 23px;
    }

    .theme-option {
      display: block;
      min-height: 96px;
      padding: 18px 20px;
    }

    .theme-option[aria-pressed="true"] {
      border-color: var(--blue);
      background: var(--selection);
    }

    .theme-swatch {
      display: inline-flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .theme-swatch i {
      width: 18px;
      height: 7px;
      background: var(--swatch);
    }

    .result-mark {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      margin-bottom: 20px;
      border-radius: 50%;
      background: rgba(158,206,106,.12);
      color: var(--green);
      font-size: 23px;
      font-weight: 800;
    }

    .result-mark.attention {
      background: rgba(247,118,142,.12);
      color: var(--error);
    }

    .result-mark.blue {
      background: rgba(122,162,247,.12);
      color: var(--blue);
    }

    .license-list {
      display: grid;
      gap: 0;
      margin-top: 20px;
      border-top: 1px solid rgba(192,202,245,.11);
    }

    .license-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(192,202,245,.11);
    }

    .license-item strong,
    .license-item span { font-size: 14px; }
    .license-item strong { color: var(--bright); }
    .license-item span { color: var(--foreground); }
    .license-item .unresolved { color: var(--warning); }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 22px;
    }

    .field { display: grid; gap: 7px; }

    .field.full { grid-column: 1 / -1; }

    .field label {
      color: var(--foreground);
      font-size: 13px;
      font-weight: 650;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 51px;
      padding: 0 14px;
      border: 1px solid rgba(192,202,245,.18);
      border-radius: 8px;
      outline: none;
      background: var(--selection);
      color: var(--bright);
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(122,162,247,.18);
    }

    .field-error {
      min-height: 18px;
      margin: 8px 0 0;
      color: var(--error);
      font-size: 13px;
    }

    .stepper {
      display: flex;
      gap: 7px;
      margin-bottom: 20px;
    }

    .stepper span {
      width: 28px;
      height: 4px;
      border-radius: 999px;
      background: var(--selection);
    }

    .stepper span.active { background: var(--blue); }
    .stepper span.done { background: var(--green); }

    .splash-view {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 55vh;
      text-align: center;
    }

    .splash-mark {
      font-family: "Omarchy Mark";
      color: var(--green);
      font-size: 86px;
      line-height: 1;
    }

    .splash-view h2 { margin: 16px 0 8px; }

    .desktop-preview {
      position: relative;
      min-height: 370px;
      overflow: hidden;
      border: 1px solid rgba(192,202,245,.12);
      border-radius: var(--radius);
      background:
        linear-gradient(var(--overlay-top), var(--overlay-top)),
        var(--wallpaper) center / cover;
    }

    .desktop-bar {
      position: absolute;
      top: 15px;
      right: 15px;
      left: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 39px;
      padding: 0 13px;
      border-radius: 8px;
      background: var(--darker);
      color: var(--foreground);
      font-size: 12px;
    }

    .desktop-message {
      position: absolute;
      bottom: 22px;
      left: 22px;
      width: 315px;
      padding: 18px;
      border-radius: 10px;
      background: var(--dark);
    }

    .desktop-message strong { display: block; margin-bottom: 5px; }

    .desktop-message small { color: var(--foreground); }

    .preview-controls {
      position: absolute;
      right: var(--safe-x);
      bottom: var(--safe-y);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(169,177,214,.78);
      font-size: 12px;
    }

    .preview-controls select {
      min-height: 34px;
      padding: 0 23px 0 7px;
      border: 0;
      border-bottom: 1px solid rgba(192,202,245,.22);
      border-radius: 0;
      background: transparent;
      color: var(--foreground);
      font-size: 12px;
    }

    .preview-controls select:disabled { opacity: .35; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 920px) {
      html, body { overflow: auto; }
      .shell { min-height: 100vh; }
      .chrome { position: relative; inset: auto; padding: 25px 25px 0; }
      #app { position: relative; inset: auto; min-height: calc(100vh - 170px); padding: 50px 25px 105px; }
      .view { width: min(100%, 760px); }
      .home-layout { grid-template-columns: 1fr; gap: 34px; }
      .system-check { justify-self: end; }
      .preview-controls { right: 25px; bottom: 22px; }
      .prototype-tag { display: none; }
      .option-list { grid-template-columns: 1fr; }
      .theme-list { grid-template-columns: 1fr; }
      .option { min-height: 84px; grid-template-columns: 38px 1fr; grid-template-rows: auto; align-items: center; }
    }

    @media (max-width: 620px) {
      .omarchy-wordmark { width: 164px; }
      .flow-actions .button { grid-template-columns: minmax(0, 1fr) 15px; }
      .flow-detail { display: none; }
      .review-row,
      .license-item,
      .form-grid { grid-template-columns: 1fr; gap: 5px; }
      .field.full { grid-column: auto; }
      .actions { align-items: stretch; flex-direction: column; }
      .button { width: 100%; }
      .phase-meta { align-items: flex-start; flex-direction: column; gap: 8px; }
      .preview-controls label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="chrome">
      <div class="brand" aria-label="Omarchy">
        <span class="omarchy-wordmark" aria-hidden="true"></span>
      </div>
      <div class="prototype-tag">Kernel manager · Omarchy 4.0.0</div>
    </header>

    <section id="app" aria-live="polite"></section>

    <div class="preview-controls">
      <label for="preview-state">Prototype state</label>
      <select id="preview-state" aria-label="Choose a prototype system state">
        <option value="not-installed">Not installed</option>
        <option value="interrupted">Interrupted</option>
        <option value="ready">Ready</option>
        <option value="update">Update available</option>
        <option value="damaged">Damaged files</option>
      </select>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const app = document.querySelector("#app");
      const shell = document.querySelector(".shell");
      const statePicker = document.querySelector("#preview-state");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const themeCatalog = {
        "tokyo-night": {
          name: "Tokyo Night",
          colors: ["#0e0e14", "#13141c", "#1a1b26", "#24283b", "#292e42", "#a9b1d6", "#c0caf5", "#7aa2f7", "#9ece6a", "#e0af68", "#f7768e"],
          overlays: ["rgba(14,14,20,.90)", "rgba(14,14,20,.78)", "rgba(14,14,20,.46)", "rgba(14,14,20,.16)", "rgba(14,14,20,.42)"],
          wallpapers: ["0-winding-road.jpg", "2-swirl-buck.jpg", "4-omakub.jpg"]
        },
        "last-horizon": {
          name: "Last Horizon",
          colors: ["#060606", "#090809", "#0c0b0c", "#0c0b0c", "#584e51", "#fafcfb", "#e2dddc", "#b59790", "#87a9b0", "#6b5e73", "#c38b7b"],
          overlays: ["rgba(6,6,6,.98)", "rgba(6,6,6,.92)", "rgba(6,6,6,.62)", "rgba(6,6,6,.28)", "rgba(6,6,6,.72)"],
          wallpapers: ["1-eyes-wide.jpg", "2-blink.jpg", "3-bokeh.jpg", "4-new-horizons.jpg"]
        },
        lupine: {
          name: "Lupine",
          mode: "light",
          colors: ["#dedede", "#ececec", "#fafafa", "#f5f5f5", "#d0d0d0", "#212121", "#000000", "#3264eb", "#4a2fd0", "#026fde", "#c900c4"],
          overlays: ["rgba(250,250,250,.98)", "rgba(250,250,250,.92)", "rgba(250,250,250,.62)", "rgba(250,250,250,.24)", "rgba(250,250,250,.72)"],
          wallpapers: ["01-cherry-blossom-bokeh.jpg", "02-cherry-blossom-white.jpg", "03-pastel-clouds.jpg", "04-elegant-blue-wave.jpg", "05-abstract-wave.jpg"]
        },
        solitude: {
          name: "Solitude",

      function focusables() {

      function focusAt(index) {
        const items = focusables();
        if (!items.length) return;
        focusIndex = (index + items.length) % items.length;
        items.forEach((item) => item.classList.remove("controller-focus"));
        items[focusIndex].classList.add("controller-focus");
        items[focusIndex].focus({ preventScroll: true });
      }

      function moveFocus(direction) {
        const items = focusables();
        if (!items.length) return;
        const current = items.includes(document.activeElement) ? document.activeElement : items[focusIndex];
        if (!current) return focusAt(0);
        const from = current.getBoundingClientRect();
        const origin = { x: from.left + from.width / 2, y: from.top + from.height / 2 };
        const vertical = direction === "up" || direction === "down";
        const sign = direction === "up" || direction === "left" ? -1 : 1;
        let best = null;
        let bestScore = Infinity;

        items.forEach((item, index) => {
          if (item === current) return;
          const rect = item.getBoundingClientRect();
          const point = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
          const primaryDelta = vertical ? point.y - origin.y : point.x - origin.x;
          const secondaryDelta = vertical ? point.x - origin.x : point.y - origin.y;
          if (primaryDelta * sign <= 6) return;
          const primary = Math.abs(primaryDelta);
          const secondary = Math.abs(secondaryDelta);
          const score = primary + secondary * 1.9 + (secondary / Math.max(primary, 1)) * 48;
          if (score < bestScore) {
            best = index;
            bestScore = score;
          }
        });

        if (best !== null) focusAt(best);
      }

            ${stepper()}<p class="eyebrow">First-owner setup</p><h2>Create your owner account</h2>
            <p class="lede compact">There is no shared default password. This password protects login and sudo.</p>
            <div class="form-grid">
              <div class="field"><label for="username">Username</label><input id="username" data-focus autocomplete="off" value="owner" maxlength="24"></div>
              <div class="field"><label for="password">Password</label><input id="password" data-focus type="password" autocomplete="new-password" placeholder="At least 4 characters"></div>
            </div>
            <p class="field-error" id="account-error" role="alert"></p>
            <div class="actions"><button class="button primary" data-focus data-action="setup-next">Continue</button><button class="button" data-focus data-action="setup-back">Back</button></div>
          `);
        } else if (step === 2) {
          render(`
            ${stepper()}<p class="eyebrow">First-owner setup</p><h2>Name this system</h2>
            <p class="lede compact">Set the network name and local time zone.</p>
            <div class="form-grid">
              <div class="field"><label for="hostname">Hostname</label><input id="hostname" data-focus autocomplete="off" value="omarchy-ps4" maxlength="63"></div>
              <div class="field"><label for="timezone">Timezone</label><select id="timezone" data-focus><option>Asia/Bishkek</option><option>UTC</option><option>America/New_York</option><option>Europe/London</option></select></div>
            </div>
            <div class="actions"><button class="button primary" data-focus data-action="setup-next">Review owner</button><button class="button" data-focus data-action="setup-back">Back</button></div>
          `);
        } else {
          render(`
            ${stepper()}<p class="eyebrow">Ready to create owner</p><h2>One account. No default password.</h2>
            <p class="lede compact">This is the final confirmation in the prototype. Nothing is written to disk.</p>
            <div class="card card-pad">
              <dl class="review-list">
                <div class="review-row"><dt>Owner</dt><dd>owner</dd></div>
                <div class="review-row"><dt>Hostname</dt><dd>omarchy-ps4</dd></div>
                <div class="review-row"><dt>Timezone</dt><dd>Asia/Bishkek</dd></div>
                <div class="review-row"><dt>Privileges</dt><dd>Normal wheel user with password sudo</dd></div>
              </dl>
              <div class="actions"><button class="button primary" data-focus data-action="create-owner">Create owner</button><button class="button" data-focus data-action="setup-back">Back</button></div>
            </div>
          `);
        }
      }

      function showDesktop() {
        page = "desktop";
        render(`
          <p class="eyebrow">Owner setup complete</p>
          <h2>Welcome to Omarchy.</h2>
          <div class="desktop-preview" aria-label="Omarchy desktop preview">
            <div class="desktop-bar"><span>Omarchy</span><span>NET&nbsp;&nbsp; VOL&nbsp;&nbsp; 14:32</span></div>
            <div class="desktop-message"><strong>Your system is ready.</strong><small>Owner created · 4.0 · external Linux root</small></div>
          </div>
          <div class="actions"><button class="button" data-focus data-action="home">Return to manager prototype</button></div>
        `);
      }

      function handleAction(action, target = null) {
        if (homeStates[systemState] && ["install", "resume", "update", "boot"].includes(action)) showProgress(action);
        else if (["verify", "restore", "export"].includes(action)) showReview(action);
        else if (action === "confirm") showProgress(activeAction);
        else if (action === "kernel") showKernel();
        else if (action === "kernel-use") systemState === "ready" ? showReview("boot") : goHome();
        else if (action === "appearance") openAppearance();
        else if (action === "theme") {
          draftThemeId = target?.dataset.theme || draftThemeId;
          applyAppearance(draftThemeId);
          showAppearance();
        } else if (action === "shuffle") {
          applyAppearance(draftThemeId, chooseWallpaper(draftThemeId, currentWallpaper));
          showAppearance();
        } else if (action === "appearance-apply") {
          savedThemeId = draftThemeId;
          localStorage.setItem(preferenceKey, savedThemeId);
          goHome();
        } else if (action === "appearance-cancel") cancelAppearance();
        else if (action === "recovery") showRecovery();
        else if (action === "credits") showCredits();
        else if (action === "home") goHome();
        else if (action === "back" || action === "cancel") goBack();
        else if (action === "splash") showSplash();
        else if (action === "setup") showSetup(0);
        else if (action === "setup-next") {
          if (setupStep === 1) {
            const username = document.querySelector("#username").value.trim();
            const password = document.querySelector("#password").value;
            if (!username || password.length < 4) {
              document.querySelector("#account-error").textContent = "Enter a username and a password with at least 4 characters.";
              return;
            }
          }
          showSetup(Math.min(3, setupStep + 1));
        } else if (action === "setup-back") showSetup(Math.max(0, setupStep - 1));
        else if (action === "create-owner") showDesktop();
      }

      function goBack() {
        if (page === "home") return;
        if (page === "appearance") cancelAppearance();
        else if (page === "kernel") goHome();
        else if (page === "recovery" || page === "credits" || page === "result") goHome();
        else if (page === "review" && ["verify", "restore", "export"].includes(activeAction)) showRecovery();
        else if (page === "review") goHome();
        else if (page === "progress") {
          if (!progressCancelable) return;
          const source = activeAction;
          clearTimeout(progressTimer);
          if (["verify", "restore", "export"].includes(source)) showRecovery(); else goHome();
        } else if (page === "splash") showResult("completed");
        else if (page === "setup") setupStep === 0 ? showSplash() : showSetup(setupStep - 1);
        else if (page === "desktop") goHome();
      }

      app.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (target && !target.disabled) handleAction(target.dataset.action, target);
      });

      document.addEventListener("keydown", (event) => {
        const editing = ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName);
        if (editing && event.key.startsWith("Arrow")) return;
        if (event.key === "ArrowDown") {
          event.preventDefault();
          moveFocus("down");
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          moveFocus("right");
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          moveFocus("up");
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          moveFocus("left");
        } else if (event.key === "Escape" || event.key === "Backspace" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
          event.preventDefault();
          goBack();
        } else if (event.key === "Enter" && !editing) {
          event.preventDefault();
          activateFocused();
        }
      });

      document.addEventListener("focusin", (event) => {
        const items = focusables();
        const index = items.indexOf(event.target);
        if (index >= 0) focusIndex = index;
      });

      statePicker.addEventListener("change", () => {
        systemState = statePicker.value;
        goHome();
      });

      function pollGamepad(time) {
        const pad = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
        if (pad) {
          const down = pad.buttons[13]?.pressed || pad.axes[1] > .6;
          const up = pad.buttons[12]?.pressed || pad.axes[1] < -.6;
          const right = pad.buttons[15]?.pressed || pad.axes[0] > .6;
          const left = pad.buttons[14]?.pressed || pad.axes[0] < -.6;
          const accept = pad.buttons[0]?.pressed;
          const back = pad.buttons[1]?.pressed;
          const active = down || up || right || left || accept || back;
          if (active && (!gamepadHeld || time - lastGamepadInput > 320)) {
            lastGamepadInput = time;
            if (down) moveFocus("down");
            else if (up) moveFocus("up");
            else if (right) moveFocus("right");
            else if (left) moveFocus("left");
            else if (accept) activateFocused();
            else if (back) goBack();
          }
          gamepadHeld = active;
        }
        requestAnimationFrame(pollGamepad);
      }

      const previewParams = new URLSearchParams(window.location.search);
      const previewTheme = previewParams.get("theme");
      applyAppearance(savedThemeId);
      if (previewParams.get("view") === "appearance") {
        openAppearance();
        if (themeCatalog[previewTheme]) {
          draftThemeId = previewTheme;
          applyAppearance(draftThemeId);
          showAppearance();
        }
      } else {
        goHome();
      }
      requestAnimationFrame(pollGamepad);
    })();
  </script>
</body>
</html>
